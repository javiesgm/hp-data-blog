# Builds the blog and publishes a preview to GitHub Pages.
# Mirrors GBIF's hosted-portal build (Jekyll 4.1 with the hp-template Gemfile.lock).
name: Preview on GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # TEMPORARY for the ci-render branch; back to read once Pages is on
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler: "2.1.4"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace \
            --config _config.yml,_config_preview.yml \
            --baseurl "/${{ github.event.repository.name }}"

      - name: Adapt for the preview address
        run: |
          BP="/${{ github.event.repository.name }}"
          # Post content links to /post/... and /assets/... from the site root; add the Pages sub-path.
          if [ -n "$BP" ]; then
            find _site -name '*.html' -print0 | xargs -0 sed -i -E "s#(src|href|srcset|poster)=\"/(post|assets|index\.xml)#\1=\"$BP/\2#g"
          fi
          # Keep the preview out of search engines.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      # TEMPORARY: publish the rendered pages (without the large post media, which are already
      # in the repo) to the ci-render branch so they can be reviewed before Pages is switched on.
      - name: Push rendered pages to ci-render branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/render && rsync -a --exclude 'post/**/*.png' --exclude 'post/**/*.jpg' --exclude 'post/**/*.jpeg' \
            --exclude 'post/**/*.gif' --exclude 'post/**/*.tsv' --exclude 'post/**/*.csv' --exclude 'post/**/*.zip' \
            --exclude 'post/**/*.webm' --exclude 'post/**/*.mp4' --exclude 'post/**/*_files/**' _site/ /tmp/render/
          cd /tmp/render && git init -q -b ci-render && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Rendered site for review"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
